<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#07090e" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3" />
  <!-- Hexagon grid subtle -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" />
  <!-- MK Monogram -->
  <path d="M 28 68 L 28 32 L 40 50 L 50 35 L 60 50 L 72 32 L 72 68" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Glowing nodes -->
  <circle cx="28" cy="32" r="3" fill="#38bdf8" />
  <circle cx="50" cy="35" r="3" fill="#818cf8" />
  <circle cx="72" cy="32" r="3" fill="#34d399" />
</svg>